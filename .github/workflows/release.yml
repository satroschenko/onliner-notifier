name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package browser extensions
        run: |
          mkdir -p release
          (cd dist/chrome && zip -qr "$GITHUB_WORKSPACE/release/onliner-notifier-chrome.zip" .)
          (cd dist/firefox && zip -qr "$GITHUB_WORKSPACE/release/onliner-notifier-firefox.xpi" .)
          (cd release && shasum -a 256 *.zip *.xpi > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.zip release/*.xpi release/SHA256SUMS.txt \
            --title "Onliner Notifier ${GITHUB_REF_NAME#v}" \
            --generate-notes
